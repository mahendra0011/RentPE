name: Build Android APK (Capacitor)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build Capacitor Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application for Capacitor (Vite -> dist)
        run: npm run vite:build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://rentpe-e6km.onrender.com' }}
          VITE_MAPTILER_API_KEY: ${{ secrets.VITE_MAPTILER_API_KEY || 'hcKUAgW8Mgd5HUTlCvTe' }}
          VITE_OPENROUTESERVICE_API_KEY: ${{ secrets.VITE_OPENROUTESERVICE_API_KEY || 'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImQyOTZhNGFlYmFkNDRmYzZiYjZiMjExZmU1NDYwNmJmIiwiaCI6Im11cm11cjY0In0=' }}

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Collect Generated APK Files
        run: |
          mkdir -p apk-output
          find android/app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} apk-output/RentPE-Capacitor.apk \;
          find android/app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} apk-output/ \;
          echo "Generated APK files in apk-output:"
          ls -lh apk-output/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RentPE-Capacitor-Android-APK
          path: apk-output/*.apk
          retention-days: 14
