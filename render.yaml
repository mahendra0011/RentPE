services:
  - type: web
    name: rentpe-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "5000"
      - key: MONGODB_DB_NAME
        value: rentPE
      - key: CLIENT_URL
        value: https://rentpe.onrender.com
      - key: CORS_ORIGINS
        value: https://rentpe.onrender.com
      - key: CLOUDINARY_FOLDER
        value: rentpe/rooms
      - key: BREVO_SENDER_NAME
        value: RentPE
      - key: MONGODB_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENROUTESERVICE_API_KEY
        sync: false

  - type: web
    name: rentpe
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://rentpe-api.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_MAPTILER_API_KEY
        sync: false
      - key: VITE_OPENROUTESERVICE_API_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
